name: Mutation testing

# Slow quality feedback runs independently of PR and release checks.
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", "uv.lock", "scripts/mutation_report.py", ".github/workflows/mutation*.yml"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"
  PYTHONUTF8: "1"
  MUTATION_FLOOR: "85"

jobs:
  mutate:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Require the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group mutation
      - name: Resume verdicts only for this immutable commit
        if: github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants
          # mutmut can retain function verdicts when only tests or callers change.
          # Restrict resume to identical source/test/config input, never another SHA.
          key: mutmut-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutmut-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-
      - name: Run mutmut
        id: mutation
        run: |
          # Preserve verdict metadata, regenerate source copies and test mapping.
          rm -rf mutants/mutmut-stats.json mutants/tests
          if [ -d mutants/src ]; then
            find mutants/src -name '*.py' -delete
            find mutants/src -name '*.py.meta' | while read -r meta; do
              source="${meta#mutants/}"
              [ -f "${source%.meta}" ] || rm -f "$meta"
            done
          fi
          uv run --group mutation mutmut run --max-children "$(nproc)" > mutmut.log 2>&1 || {
            tail -n 200 mutmut.log
            exit 1
          }
          touch mutants/complete
          tail -n 3 mutmut.log
          uv run --group mutation mutmut results --all true > mutation-results.txt
      - name: Save verdicts for later runs
        if: always() && steps.mutation.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants
          key: mutmut-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report complete full-package results
        if: steps.mutation.outcome == 'success'
        run: |
          set -o pipefail
          uv run --group mutation python scripts/mutation_report.py mutation-results.txt \
            --fail-under "$MUTATION_FLOOR" --show-diffs 25 \
            --json-output mutation-summary.json --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scope full-package | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results-${{ github.run_attempt }}
          path: |
            mutation-summary.json
            mutation-results.txt
            mutmut.log
          if-no-files-found: ignore
          retention-days: 30
