name: Release
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish the current reviewed main commit to TestPyPI only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    name: Version and changelog
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill'
      && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        sparse-checkout: |
          .github/release-tools
          scripts/release_boundary.cjs
        sparse-checkout-cone-mode: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: |
          const { ReleaseBoundary } = require('./scripts/release_boundary.cjs');
          await ReleaseBoundary.context({github, context, core});
      name: Require unchanged reviewed main before writer calls
    - name: Install integrity-locked release tool without package scripts
      run: npm ci --prefix .github/release-tools --ignore-scripts --no-audit --no-fund
    - name: Tag a merged version PR
      run: node .github/release-tools/node_modules/release-please/build/src/bin/release-please.js github-release
        --token="$TOKEN" --repo-url="$GITHUB_REPOSITORY" --target-branch=main
      env:
        TOKEN: ${{ github.token }}
    - name: Open or update version PR
      run: node .github/release-tools/node_modules/release-please/build/src/bin/release-please.js release-pr --token="$TOKEN"
        --repo-url="$GITHUB_REPOSITORY" --target-branch=main
      env:
        TOKEN: ${{ github.token }}
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: |
          const { ReleaseBoundary } = require('./scripts/release_boundary.cjs');
          await ReleaseBoundary.versionPr({github, context, core});
      name: Dispatch only exact verified version-PR checks; never approve runs
  target:
    name: Validate release source
    needs: release-please
    if: always() && github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor ==
      'mikejhill' && ((github.event_name == 'push' && needs.release-please.result == 'success') || inputs.testpypi)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      mode: ${{ steps.target.outputs.mode }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        sparse-checkout: |
          .github/release-tools
          scripts/release_boundary.cjs
        sparse-checkout-cone-mode: false
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: target
      env:
        TESTPYPI: ${{ inputs.testpypi || false }}
      with:
        script: |
          const { ReleaseBoundary } = require('./scripts/release_boundary.cjs');
          await ReleaseBoundary.releaseTarget({github, context, core}, process.env.TESTPYPI === 'true');
  ci:
    name: CI
    needs: target
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill'
      && contains(fromJSON('["pypi","testpypi"]'), needs.target.outputs.mode)
    # Same-commit local call; keep the syntax supported by the pinned actionlint.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      source_sha: ${{ needs.target.outputs.sha }}
    permissions:
      contents: read
  build:
    name: Build distributions
    needs:
    - target
    - ci
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill'
      && needs.ci.result == 'success' && contains(fromJSON('["pypi","testpypi"]'), needs.target.outputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
        ref: ${{ needs.target.outputs.sha }}
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        python-version: '3.12'
    - name: Build sdist and wheel
      run: uv build
    - name: Check package metadata
      run: uvx twine@7.0.0 check --strict dist/*
    - name: Version must match the release tag
      if: needs.target.outputs.mode == 'pypi'
      env:
        TAG: ${{ needs.target.outputs.tag }}
      run: |
        version="${TAG#v}"
        ls "dist/skillsinc-$version-py3-none-any.whl" "dist/skillsinc-$version.tar.gz"
    - name: Smoke test the installed wheel
      run: |
        uv venv .smoke-venv
        uv pip install --python .smoke-venv/bin/python dist/*.whl
        .smoke-venv/bin/skillsinc --version
        .smoke-venv/bin/skillsinc profiles
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: dist-${{ github.sha }}
        path: dist/
        if-no-files-found: error
      id: dist
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.dist.outputs.artifact-id }}
  publish-pypi:
    name: Publish to PyPI
    needs:
    - target
    - build
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill'
      && needs.build.result == 'success' && needs.target.outputs.mode == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/skillsinc/
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
        path: dist/
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: dist/*
    - name: Publish (trusted publishing, PEP 740 attestations)
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      with:
        skip-existing: 'true'
    - name: Attach distributions to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.target.outputs.tag }}
      run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
  publish-testpypi:
    name: Publish to TestPyPI
    needs:
    - target
    - build
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill'
      && needs.build.result == 'success' && needs.target.outputs.mode == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/skillsinc/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
        path: dist/
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: 'true'
