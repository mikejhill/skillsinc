name: Release

on:
  workflow_dispatch:
    inputs:
      force-patch:
        description: Force a patch bump when no releasable commits exist
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Determine next version
        id: version
        env:
          FORCE_PATCH: ${{ inputs.force-patch }}
        run: |
          args=()
          if [[ "$FORCE_PATCH" == "true" ]]; then args+=(--force-patch); fi
          echo "version=$(uv run scripts/next_version.py "${args[@]}")" >> "$GITHUB_OUTPUT"
      - name: Require a valid version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::No valid version bump. Add releasable commits or use force-patch."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Release tag already exists."
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run poe check
      - name: Validate and promote the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run python - <<'PY'
          import datetime
          import os
          import pathlib
          import re

          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          version = os.environ["VERSION"]
          headers = list(re.finditer(r"^## \[Unreleased\]\s*$", text, re.MULTILINE))
          if len(headers) != 1:
              raise SystemExit("CHANGELOG.md must contain exactly one ## [Unreleased] header")
          if re.search(rf"^## \[{re.escape(version)}\]", text, re.MULTILINE):
              raise SystemExit("CHANGELOG.md already contains the release version")
          header = headers[0]
          rest = text[header.end():]
          section = re.split(r"^## ", rest, maxsplit=1, flags=re.MULTILINE)[0]
          if not re.search(r"^### (Added|Changed|Deprecated|Removed|Fixed|Security)$", section, re.MULTILINE):
              raise SystemExit("Unreleased must contain a Keep a Changelog category")
          if not re.search(r"^[-*] \S", section, re.MULTILINE):
              raise SystemExit("Unreleased must contain at least one change entry")
          date = datetime.datetime.now(datetime.UTC).date().isoformat()
          replacement = f"## [Unreleased]\n\n## [{version}] - {date}\n\n"
          updated = text[:header.start()] + replacement + rest.lstrip("\n")
          if len(re.findall(r"^## \[Unreleased\]$", updated, re.MULTILINE)) != 1:
              raise SystemExit("Unreleased header verification failed")
          if f"## [{version}] - {date}" not in updated:
              raise SystemExit("Version header verification failed")
          path.write_text(updated, encoding="utf-8", newline="\n")
          PY
      - name: Bump package and lockfile versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv version "$VERSION"
          uv lock
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Commit, tag, and push the release atomically
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" dist/* --title "v$VERSION" --generate-notes --verify-tag

  pypi:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
