name: Bug report
description: Report incorrect behavior.
title: "fix: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal configuration.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include relevant error output. Remove secrets and private paths.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: skillsinc version, Python version, OS, and target harness
    validations:
      required: true
