[project]
name = "skillsinc"
version = "0.1.0"
description = "Sync one library of agent skills, instructions, agents, and prompts into every AI coding harness you use."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mike Hill", email = "mike@mikejhill.com" }]
requires-python = ">=3.12"
keywords = ["agents", "skills", "claude-code", "codex", "copilot", "sync"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/mikejhill/skillsinc"
Issues = "https://github.com/mikejhill/skillsinc/issues"
Changelog = "https://github.com/mikejhill/skillsinc/blob/main/CHANGELOG.md"

[project.scripts]
skillsinc = "skillsinc.__main__:Application.main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "BLE", "C4", "C90", "D", "DTZ", "E", "ERA", "F",
    "FA", "FBT", "G", "I", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH",
    "RET", "RSE", "RUF", "S", "SIM", "T20", "TID", "TRY", "UP", "W",
]
ignore = [
    "D107",    # __init__ docstring: the class docstring covers it
    "TRY003",  # long messages in raise: context-rich messages are required here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest works
    "PLR2004",  # literal expected values are clearer in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true

[tool.coverage.run]
source = ["skillsinc"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.poe.tasks]
format = { cmd = "ruff format .", help = "Format code" }
format-check = { cmd = "ruff format --check .", help = "Check formatting" }
lint = { cmd = "ruff check .", help = "Lint code" }
lint-fix = { cmd = "ruff check . --fix", help = "Lint and auto-fix" }
typecheck = { cmd = "ty check", help = "Type check (strict)" }
test = { cmd = "pytest --cov", help = "Run tests with coverage" }
docs-lint = { cmd = "npx --yes markdownlint-cli2", help = "Lint Markdown documentation" }
fix = { sequence = ["format", "lint-fix"], help = "Auto-fix formatting and lint" }
check = { sequence = ["format-check", "lint", "typecheck", "test"], help = "Run every Python quality gate" }
